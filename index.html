<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103e35" />
    <meta name="description" content="毎月の支出、労働収入、年金収入、年率の想定利回りから金融資産の推移を試算する資産寿命シミュレータ" />
    <title>資産寿命シミュレータ</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="WIMP トップへ">
          <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
            <rect class="brand-mark-frame" x="1.5" y="1.5" width="33" height="33" rx="10" />
            <path class="brand-mark-letter" d="M8 10.5 13 25l5-10 5 10 5-14.5" />
            <path class="brand-mark-accent" d="M24.5 25.5h4" />
          </svg>
          <span class="brand-name">WIMP</span>
        </a>
        <span class="header-caption">Wealth, Income &amp; Money-flow Projection <span lang="ja">（資産寿命シミュレータ）</span></span>
      </div>
    </header>

    <main id="top">
      <div class="workspace shell">
        <aside class="input-panel" aria-labelledby="conditions-title">
          <div class="panel-heading">
            <span class="section-number">01 / INPUT</span>
            <h2 id="conditions-title">試算条件</h2>
          </div>
          <form id="simulation-form" novalidate>
            <section class="form-section" aria-labelledby="basic-title">
              <div class="form-section-title"><span class="section-icon">01</span><h3 id="basic-title">基本情報</h3></div>
              <div class="field-grid two-col">
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">01</span>現在の年齢</span><span class="input-wrap"><input name="currentAge" type="number" min="18" max="100" step="1" inputmode="numeric" required /><span class="unit">歳</span></span></label>
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">02</span>試算終了時の年齢</span><span class="input-wrap"><input name="endAge" type="number" min="19" max="110" step="1" inputmode="numeric" required /><span class="unit">歳</span></span></label>
              </div>
              <div class="field-grid two-col">
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">03</span>現在の金融資産</span><span class="input-wrap"><input name="startingAssets" type="number" min="0" step="0.1" inputmode="decimal" required /><span class="unit">万円</span></span></label>
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">04</span>年率の想定利回り</span><span class="input-wrap"><input name="annualReturn" type="number" min="-99" max="100" step="0.1" inputmode="decimal" required /><span class="unit">%</span></span></label>
              </div>
              <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">05</span>年率のインフレ率</span><span class="input-wrap"><input name="annualInflation" type="number" min="-20" max="50" step="0.1" inputmode="decimal" required /><span class="unit">%</span></span></label>
            </section>

            <section class="form-section" aria-labelledby="income-title">
              <div class="form-section-title"><span class="section-icon">02</span><h3 id="income-title">収入</h3></div>
              <div class="field-grid two-col">
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">06</span>毎月の労働収入</span><span class="input-wrap"><input name="monthlySalary" type="number" min="0" step="0.1" inputmode="decimal" required /><span class="unit">万円</span></span></label>
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">07</span>労働収入の終了年齢</span><span class="input-wrap"><input name="retirementAge" type="number" min="18" max="110" step="1" inputmode="numeric" required /><span class="unit">歳</span></span></label>
              </div>
              <div class="field-grid two-col">
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">08</span>毎月の年金収入</span><span class="input-wrap"><input name="monthlyPension" type="number" min="0" step="0.1" inputmode="decimal" required /><span class="unit">万円</span></span></label>
                <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">09</span>年金受給開始年齢</span><span class="input-wrap"><input name="pensionStartAge" type="number" min="60" max="75" step="1" inputmode="numeric" required /><span class="unit">歳</span></span></label>
              </div>
            </section>

            <section class="form-section spending-section" aria-labelledby="spending-title">
              <div class="form-section-title"><span class="section-icon">03</span><h3 id="spending-title">支出</h3></div>
              <label class="field"><span class="field-label"><span class="field-number" aria-hidden="true">10</span>毎月の支出</span><span class="input-wrap"><input name="baseMonthlySpending" type="number" min="0" step="0.1" inputmode="decimal" required /><span class="unit">万円</span></span></label>
              <div class="stage-head"><span>支出の切替年齢</span><span>切替後の毎月の支出</span></div>
              <div id="spending-stages" class="stage-list"></div>
              <button id="add-stage" class="add-button" type="button"><span aria-hidden="true">＋</span> 支出の設定を追加</button>
            </section>
          </form>
          <p id="form-error" class="form-error" role="alert" hidden></p>
        </aside>

        <section class="result-panel" aria-labelledby="results-title">
          <div class="result-heading">
            <div><span class="section-number">02 / PROJECTION</span><h2 id="results-title">試算結果</h2></div>
          </div>
          <div class="metrics" aria-label="主な試算結果">
            <article class="metric metric-primary"><span class="metric-label">試算終了時の金融資産</span><strong id="ending-balance">—</strong></article>
            <article class="metric"><span class="metric-label">資産不足の発生時期</span><strong id="shortfall-age">—</strong></article>
          </div>

          <div class="chart-card">
              <div class="chart-header">
                <div><h3>金融資産残高の推移</h3><p>年齢ごとの金融資産残高（万円）</p></div>
              <div class="chart-tools">
                <div class="chart-legend"><span><i class="legend-green"></i> 金融資産残高</span></div>
                <div class="download-actions"><button id="download-csv" type="button" class="button button-primary">CSV ↓</button><button id="download-png" type="button" class="button button-secondary">PNG ↓</button></div>
              </div>
            </div>
            <div class="chart-scroll"><svg id="projection-chart" viewBox="0 0 920 276" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">年齢ごとの金融資産残高</title><desc id="chart-desc">現在の年齢から試算終了時の年齢までの金融資産残高を示します。</desc></svg></div>
            <div class="chart-footer"><span>年間の内訳を表示する年齢</span><label class="age-picker"><select id="age-select" aria-label="年間の内訳を表示する年齢"></select></label></div>
          </div>

          <div class="detail-card">
            <p class="detail-reference-note">年齢は01〜02の範囲で表示します。各行の番号は左の試算条件に対応します。</p>
            <div class="detail-head"><h3 id="detail-title">—</h3><span class="detail-period" id="detail-period">—</span></div>
            <div class="detail-grid" id="detail-grid"></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
